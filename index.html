<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Love ❤️</title>
    <!-- 귀여운 하트 모양 파비콘 설정 (404 방지) -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>❤️</text></svg>">
    <!-- 구글 폰트 로드: 미니멀 테마에 맞춘 로맨틱 필기체 'Pacifico', 'Noto Sans KR', 'Gamja Flower' -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Gamja+Flower&family=Noto+Sans+KR:wght@300;400;700;900&family=Pacifico&display=swap" rel="stylesheet">
    
    <style>
        /* 테마별 디자인 시스템 (CSS Custom Properties) */
        :root {
            /* 1. Lovely Pink (러블리 핑크) */
            --lovely-bg-gradient: linear-gradient(135deg, #ffe5ec 0%, #ffc2d1 50%, #ffb3c6 100%);
            --lovely-card-bg: rgba(255, 255, 255, 0.85);
            --lovely-card-border: 2px solid #ff8fab;
            --lovely-card-shadow: 0 15px 35px rgba(255, 143, 171, 0.45);
            --lovely-primary-color: #ff5c8a;
            --lovely-text-main: #c9184a;
            --lovely-font: 'Pacifico', 'Gamja Flower', 'Noto Sans KR', sans-serif;
            --lovely-heart-pulse: #ff4d6d;
            --lovely-edit-hover: rgba(255, 143, 171, 0.15);

            /* 2. Dreamy Pastel (드림 파스텔) */
            --pastel-bg-gradient: linear-gradient(225deg, #b3c5ff 0%, #cff4fc 40%, #e8dbfc 80%, #ffd6e8 100%);
            --pastel-card-bg: rgba(255, 255, 255, 0.35);
            --pastel-card-border: 1px solid rgba(255, 255, 255, 0.55);
            --pastel-card-shadow: 0 20px 40px rgba(142, 154, 255, 0.2);
            --pastel-primary-color: #8e9aff;
            --pastel-text-main: #4a549a;
            --pastel-font: 'Pacifico', 'Noto Sans KR', sans-serif;
            --pastel-heart-pulse: #ff9ebb;
            --pastel-edit-hover: rgba(142, 154, 255, 0.12);

            /* 현재 활성화된 테마 변수들 */
            --bg-gradient: var(--pastel-bg-gradient);
            --card-bg: var(--pastel-card-bg);
            --card-border: var(--pastel-card-border);
            --card-shadow: var(--pastel-card-shadow);
            --primary-color: var(--pastel-primary-color);
            --text-main: var(--pastel-text-main);
            --font-family: var(--pastel-font);
            --heart-pulse: var(--pastel-heart-pulse);
            --edit-hover: var(--pastel-edit-hover);
        }

        /* 기본 레이아웃 초기화 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation; /* 모바일 더블 탭 확대 지연 방지 ➜ 터치 가속 0ms 제공 */
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: var(--bg-gradient);
            font-family: var(--font-family);
            transition: background 1s ease, font-family 0.5s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            
            /* 가변 모바일 주소창/내비게이션바 수직 높이 버그 완결 해결책 (Dynamic Viewport Height) */
            min-height: -webkit-fill-available;
            min-height: 100dvh; 
        }

        /* 배경 비디오 스타일 */
        #bgVideo {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 0;
            pointer-events: none; /* 클릭 이벤트 투과 */
            opacity: 0; /* 기본적으로 비디오는 비워두어 숨겨둠 (동적 쿼리에 반응) */
            mix-blend-mode: overlay; /* 테마 배경색과 정교하게 혼합 */
            transition: opacity 1s ease, filter 1s ease;
        }

        /* 업로드용 이미지 배경 플레이어 (부드러운 디졸브 지원) */
        #bgImage {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            z-index: 0;
            pointer-events: none;
            opacity: 0; /* 평소에는 숨김 */
            mix-blend-mode: overlay; /* 테마색과 오버레이 */
            transition: opacity 1s ease, filter 1s ease;
        }

        /* 테마별 비디오/이미지 무드 필터 동적 연출 */
        body.theme-lovely #bgVideo,
        body.theme-lovely #bgImage {
            filter: grayscale(0.2) sepia(0.1) hue-rotate(-20deg) brightness(1.05);
        }
        body.theme-pastel #bgVideo,
        body.theme-pastel #bgImage {
            filter: none;
        }

        /* 뒷배경 Canvas */
        #heartCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        /* 전체 컨트롤 오버레이 */
        .overlay {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            pointer-events: none;
            
            /* 세이프 에어리어 노치 디자인 스마트폰 완벽 대응 */
            padding: max(30px, env(safe-area-inset-top)) 20px max(30px, env(safe-area-inset-bottom)) 20px;
            height: 100dvh;
        }

        /* 상단 바 (테마 체인저 & 배경 업로더 탑재) */
        .top-bar {
            width: 100%;
            max-width: 800px;
            display: flex;
            justify-content: space-between; /* 왼쪽에 테마 전환, 오른쪽에 유틸리티 정돈 */
            align-items: center;
            pointer-events: auto;
            margin-bottom: auto;
        }

        /* 테마 스위처 */
        .theme-selector {
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 30px;
            padding: 5px;
            display: flex;
            gap: 5px;
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            transition: all 0.5s ease;
        }

        .theme-btn {
            background: transparent;
            border: none;
            padding: 8px 16px;
            font-size: 13px;
            font-weight: bold;
            border-radius: 20px;
            cursor: pointer;
            color: #333;
            font-family: 'Noto Sans KR', sans-serif;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .theme-btn.active {
            background: #ffffff;
            color: #ff4d6d;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        /* 우측 상단 유틸리티 단추 그룹 */
        .utility-group {
            display: flex;
            gap: 8px;
            pointer-events: auto;
        }

        /* 글래스모피즘 원형 버튼 통일 디자인 */
        .upload-trigger,
        .utility-btn {
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 50%;
            width: 44px;
            height: 44px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            transition: all 0.3s ease;
        }

        .upload-trigger:hover,
        .utility-btn:hover {
            transform: scale(1.05);
            background: rgba(255, 255, 255, 0.35);
            box-shadow: 0 4px 15px rgba(255, 77, 109, 0.15);
        }

        .upload-trigger svg,
        .utility-btn svg {
            width: 20px;
            height: 20px;
            fill: #333;
            transition: fill 0.3s ease;
        }

        /* 중앙 미니멀 Love 카드 컨테이너 (정적 고정) */
        .card-container {
            pointer-events: auto;
            z-index: 5;
            margin-top: -30px;
            margin-bottom: auto;
        }

        .message-card {
            width: 320px;
            height: 140px;
            background: var(--card-bg);
            border: var(--card-border);
            box-shadow: var(--card-shadow);
            border-radius: 24px;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: background 0.8s ease, border 0.8s ease, box-shadow 0.8s ease;
            position: relative;
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
        }

        /* 미니멀 Love {n} 타이포그래피 */
        .love-title {
            font-size: 38px;
            font-weight: 700;
            color: var(--text-main);
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            gap: 10px;
            text-align: center;
            justify-content: center;
            transition: color 0.8s ease;
            font-family: var(--font-family);
        }

        /* 우아한 영문 필기체 및 손글씨 폴백 */
        .love-title,
        body.theme-lovely .love-title,
        body.theme-pastel .love-title {
            font-family: 'Pacifico', 'Gamja Flower', cursive, sans-serif;
            font-weight: normal;
        }

        /* 한글 이름 정렬 보정 및 인플레이스 편집 UI/UX 최적화 */
        .love-title span {
            font-family: 'Noto Sans KR', sans-serif;
            font-weight: 900;
            font-size: 34px;
            display: inline-block;
            cursor: pointer; /* 마우스 오버 시 편집 가능 암시 */
            outline: none; /* 브라우저 기본 파란 테두리 제거 */
            border-radius: 6px;
            padding: 2px 6px;
            transition: background-color 0.3s ease, box-shadow 0.3s ease;
            position: relative;
            user-select: text; /* 텍스트 입력 가능하도록 허용 */
            -webkit-user-select: text;
        }

        /* 마우스 오버 시 미세하게 편집 가능 영역 부각 */
        .love-title span:hover {
            background-color: var(--edit-hover);
        }

        /* 인플레이스 편집 중(contenteditable="true") 스타일링 */
        .love-title span[contenteditable="true"] {
            background-color: rgba(255, 255, 255, 0.25) !important;
            box-shadow: 0 0 12px rgba(255, 255, 255, 0.4);
            cursor: text; /* 입력 커서로 변경 */
        }

        /* 영어 You 흘림체 강조 */
        .love-title span.english-you {
            font-family: 'Pacifico', cursive, sans-serif;
            font-weight: normal;
            font-size: 38px;
        }

        /* 페이드 효과가 들어간 영롱한 파스텔 토스트 알림 */
        #toast {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translate(-50%, 50px);
            background: rgba(255, 255, 255, 0.45);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            color: var(--text-main);
            font-family: 'Noto Sans KR', sans-serif;
            font-weight: bold;
            font-size: 14px;
            padding: 12px 28px;
            border-radius: 50px;
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s cubic-bezier(0.19, 1, 0.22, 1), transform 0.5s cubic-bezier(0.19, 1, 0.22, 1);
        }
        
        #toast.show {
            opacity: 1;
            transform: translate(-50%, 0);
        }

        body.theme-lovely #toast {
            color: var(--lovely-text-main);
            border: 1px solid rgba(255, 143, 171, 0.6);
            box-shadow: 0 10px 30px rgba(255, 143, 171, 0.15);
            background: rgba(255, 255, 255, 0.88);
        }

        /* 모바일 반응형 조절 (모바일 화면 완벽 최적화 완료) */
        @media (max-width: 480px) {
            .message-card {
                width: 290px;
                height: 130px;
                border-radius: 22px;
            }
            .love-title {
                font-size: 32px;
                gap: 6px;
            }
            .love-title span {
                font-size: 28px;
            }
            .love-title span.english-you {
                font-size: 32px;
            }
            
            /* [모바일 가로 정렬 고수] 세로로 무너져 답답해지지 않도록 가로 한 줄로 유지하면서 콤팩트화 */
            .top-bar {
                flex-direction: row !important;
                justify-content: space-between !important;
                gap: 0;
                padding-top: 0;
            }
            
            .theme-btn {
                padding: 6px 10px;
                font-size: 11px;
            }
            
            /* 유틸리티 버튼 크기 모바일 축소 (38px) ➜ 비좁은 모바일에서도 한 줄에 완벽 정렬 수납 */
            .upload-trigger,
            .utility-btn {
                width: 36px;
                height: 36px;
            }
            
            .upload-trigger svg,
            .utility-btn svg {
                width: 16px;
                height: 16px;
            }
            
            .card-container {
                margin-top: -10px;
            }
            
            #toast {
                font-size: 12px;
                padding: 10px 20px;
                bottom: 30px;
                width: 85%;
                text-align: center;
            }
        }
    </style>
</head>
<body>

    <!-- 감성 배경 비디오 (기본 src 제거완료, 동적 쿼리에 반응) -->
    <video id="bgVideo" autoplay muted loop playsinline></video>

    <!-- 업로드용 이미지 배경 레이어 (부드러운 상호 디졸브 전환용) -->
    <div id="bgImage"></div>

    <!-- 하트 파티클을 60fps로 흩날려 줄 Canvas -->
    <canvas id="heartCanvas"></canvas>

    <!-- UI 오버레이 -->
    <div class="overlay">
        
        <!-- 상단 바: 테마 선택 컨트롤 및 배경 이미지/영상 수동 파일 업로더 단추 배치 -->
        <header class="top-bar">
            <!-- 테마 세그먼트 스위처 -->
            <div class="theme-selector">
                <button class="theme-btn" onclick="switchTheme('lovely')">러블리 핑크</button>
                <button class="theme-btn" onclick="switchTheme('pastel')">드림 파스텔</button>
            </div>

            <!-- 우측 유틸리티 단추 그룹 -->
            <div class="utility-group">
                <!-- 배경 파일 업로드 버튼 (구름 아이콘) -->
                <button class="upload-trigger" onclick="triggerBgUpload()" title="내 파일(사진/동영상)로 배경 변경">
                    <svg viewBox="0 0 24 24">
                        <path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 4-1.79 4-4 0-2.05-1.55-3.84-3.65-3.96zM14 13v4h-4v-4H7l5-5 5 5h-3z"/>
                    </svg>
                </button>
                <!-- 숨겨진 파일 인풋 컨트롤 -->
                <input type="file" id="bgFileInput" accept="image/*, video/*" style="display: none;" onchange="handleBgFileChange(event)">

                <!-- 링크 복사 버튼 (복사 아이콘) -->
                <button class="utility-btn" onclick="copyShareLink()" title="주소창 링크 복사">
                    <svg viewBox="0 0 24 24">
                        <path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/>
                    </svg>
                </button>

                <!-- 북마크 저장 유도 버튼 (별 아이콘) -->
                <button class="utility-btn" onclick="showBookmarkGuide()" title="이 주소 북마크(즐겨찾기) 추가">
                    <svg viewBox="0 0 24 24">
                        <path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/>
                    </svg>
                </button>
            </div>
        </header>

        <!-- 중앙 미니멀 Love 카드 (고정형 정적 카드) -->
        <main class="card-container">
            <div class="message-card" id="messageCard">
                <h1 class="love-title">
                    Love <span id="recipientName" title="더블 클릭하여 이름을 변경하세요!">You</span>
                </h1>
            </div>
        </main>

    </div>

    <!-- 플로팅 토스트 파스텔 메세지 박스 -->
    <div id="toast"></div>

    <!-- 스크립트: Canvas 파티클, 테마 스위처, 인플레이스 더블클릭 편집, 배경 GZIP 업로드, 토스트 및 URL 해시 동기화 -->
    <script>
        // ==========================================
        // 1. [하이브리드 파라미터 파서] # 해시 스키마와 ? 쿼리 동시 디코딩 지원
        // ==========================================
        function getParam(name) {
            const hash = window.location.hash.substring(1);
            const hashParams = new URLSearchParams(hash);
            if (hashParams.has(name)) {
                return decodeURIComponent(hashParams.get(name));
            }
            
            const queryParams = new URLSearchParams(window.location.search);
            if (queryParams.has(name)) {
                return decodeURIComponent(queryParams.get(name));
            }
            return null;
        }

        // [주소창 Hash 동적 업데이트 엔진] - 서버 HTTP 414 URI Too Long 원천 격리
        function updateUrlHash(updates) {
            const hash = window.location.hash.substring(1);
            const hashParams = new URLSearchParams(hash);

            // 변경 사항 반영
            for (const [key, value] of Object.entries(updates)) {
                if (value !== undefined && value !== null && value !== '') {
                    hashParams.set(key, value);
                } else {
                    hashParams.delete(key);
                }
            }

            const newHash = hashParams.toString();
            const cleanUrl = window.location.protocol + '//' + window.location.host + window.location.pathname;

            // 주소창의 ? 쿼리 영역은 말끔히 제거하고, 오직 # 뒤로만 데이터 누적
            window.history.replaceState({}, '', cleanUrl + (newHash ? '#' + newHash : ''));
        }

        // 이름 파라미터 해독 및 바인딩
        const nameParam = getParam('n');
        const recipientNameEl = document.getElementById('recipientName');

        if (nameParam && nameParam.trim() !== '') {
            const safeName = nameParam.replace(/[&<>"']/g, function(m) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m];
            });
            recipientNameEl.classList.remove('english-you');
            recipientNameEl.innerText = safeName;
        } else {
            recipientNameEl.classList.add('english-you');
            recipientNameEl.innerText = 'You';
        }

        // 초기 테마 파라미터 파싱
        const themeParam = getParam('t') || getParam('theme');
        let initialTheme = 'pastel'; // 디폴트는 파스텔
        
        if (themeParam === 'lovely' || themeParam === 'pastel') {
            initialTheme = themeParam;
        }

        // 바디 클래스 초기 설정
        document.body.className = `theme-${initialTheme}`;

        // ==========================================
        // 2. 테마 스위처 설정 (Lovely / Pastel 지원 + 해시 스키마 연계)
        // ==========================================
        let currentTheme = initialTheme;

        function switchTheme(themeName, isInitial = false) {
            if (!isInitial && currentTheme === themeName) return;
            
            document.body.className = `theme-${themeName}`;
            currentTheme = themeName;

            // CSS 변수 셋 업데이트
            const root = document.documentElement;
            root.style.setProperty('--bg-gradient', `var(--${themeName}-bg-gradient)`);
            root.style.setProperty('--card-bg', `var(--${themeName}-card-bg)`);
            root.style.setProperty('--card-border', `var(--${themeName}-card-border)`);
            root.style.setProperty('--card-shadow', `var(--${themeName}-card-shadow)`);
            root.style.setProperty('--primary-color', `var(--${themeName}-primary-color)`);
            root.style.setProperty('--text-main', `var(--${themeName}-text-main)`);
            root.style.setProperty('--font-family', `var(--${themeName}-font)`);
            root.style.setProperty('--heart-pulse', `var(--${themeName}-heart-pulse)`);
            root.style.setProperty('--edit-hover', `var(--${themeName}-edit-hover)`);

            // 상단 버튼 액티브 상태 동기화
            const buttons = document.querySelectorAll('.theme-btn');
            buttons.forEach(btn => btn.classList.remove('active'));
            
            const btnIdx = { lovely: 0, pastel: 1 };
            buttons[btnIdx[themeName]].classList.add('active');

            // 동영상/이미지 업로드 존재 여부에 따른 투명도 자동 정비
            const isBgVideoActive = bgVideoEl.hasAttribute('src') && bgVideoEl.src !== '';

            if (isBgVideoActive) {

                bgVideoEl.style.opacity = '0';
                bgImageEl.style.opacity = '0';

            // 테마별 하트 캔버스 파티클 풀 리셋
            initHearts();

            // 사용자가 수동 변경 시 페이지 리로드 없이 주소창 해시 쿼리 동적 업데이트

        }

        // ==========================================
        // 3. 인플레이스 이름 변경 & 더블클릭 및 해시 갱신 이벤트
        // ==========================================

        recipientNameEl.addEventListener('dblclick', (e) => {

        // 편집 완료 감지 (포커스 아웃 및 엔터 입력 완료)
        function finishEditingName() {
            recipientNameEl.contentEditable = "false";

        // 포커스 아웃 시 저장
        recipientNameEl.addEventListener('blur', finishEditingName);

        // 엔터 키 입력 시 완료 처리 및 이스케이프 지원
        recipientNameEl.addEventListener('keydown', (e) => {

        // ==========================================
        // 4. 로컬 컴퓨터 배경 파일 업로드 및 GZIP 스트림 압축 & 유틸리티 복사/북마크 기능
        // ==========================================
        const bgVideoEl = document.getElementById('bgVideo');
        const bgImageEl = document.getElementById('bgImage');
        const fileInputEl = document.getElementById('bgFileInput');

        // [비동기 기본 Gzip 압축기]
        async function compressGzip(arrayBuffer) {
            const stream = new Response(arrayBuffer).body.pipeThrough(new CompressionStream('gzip'));
            const response = new Response(stream);
            return await response.arrayBuffer();
        }

        // [비동기 기본 Gzip 압축해제기]
        async function decompressGzip(compressedUint8Array) {
            const stream = new Response(compressedUint8Array).body.pipeThrough(new DecompressionStream('gzip'));
            const response = new Response(stream);
            const buffer = await response.arrayBuffer();
            return new Uint8Array(buffer);
        }

        // [이진 바이너리 ➜ 고성능 비동기 Base64 변환기]
        function arrayBufferToBase64(buffer) {
            return new Promise((resolve) => {
                const blob = new Blob([buffer], { type: 'application/octet-stream' });
                const reader = new FileReader();
                reader.onload = function(e) {
                    const dataUrl = e.target.result;
                    const base64 = dataUrl.split(',')[1];
                    resolve(base64);
                };
                reader.readAsDataURL(blob);
            });
        }

        // [Base64 ➜ 바이너리 Uint8Array 고성능 변환기]
        function base64ToUint8(base64) {
            const binaryString = window.atob(base64);
            const len = binaryString.length;
            const bytes = new Uint8Array(len);
            for (let i = 0; i < len; i++) {
                bytes[i] = binaryString.charCodeAt(i);
            }
            return bytes;
        }

        // [사용자 요구사항 반영 1] 업로드 시 confirm과 url 입력칸 완전 배제 ➜ 클릭 시 곧바로 파일 탐색기 작동!
        function triggerBgUpload() {
            fileInputEl.click(); 
        }

        // [사용자 요구사항 반영 2] 링크 복사 및 세련된 토스트 알림 탑재
        let toastTimer = null;
        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.innerText = message;
            toast.classList.add('show');
            
            if (toastTimer) clearTimeout(toastTimer);
            
            toastTimer = setTimeout(() => {
                toast.classList.remove('show');
            }, 2500);
        }

        function copyShareLink() {
            const url = window.location.href;
            navigator.clipboard.writeText(url).then(() => {
                showToast("클립보드에 나만의 정원 주소가 복사되었습니다! ❤️");
            }).catch(err => {
                showToast("주소 복사에 실패했습니다. 브라우저 주소창 주소를 복사해 주세요!");
            });
        }

        // [사용자 요구사항 반영 3] 즐겨찾기 안내 팝업 유도
        function showBookmarkGuide() {
            const isMac = navigator.platform.toUpperCase().indexOf('MAC') >= 0;
            const keyCombo = isMac ? 'Cmd + D' : 'Ctrl + D';
            showToast(`⭐ ${keyCombo} 키를 눌러 이 소중한 정원을 즐겨찾기에 등록해 보세요!`);
        }

        // 수동 파일 로드 시 Gzip 무손실 스트림 압축 가동 (해시 앵커 연동)
        async function handleBgFileChange(e) {
            const file = e.target.files[0];
            if (!file) return;

            if (file.type.startsWith('image/')) {
                // 이미지 업로드 시 가로 180px 압축 후 해시 스키마 동기화
                compressAndSyncImage(file);
                
            } else if (file.type.startsWith('video/')) {
                // [비디오 업로드 - Gzip 압축 연동]
                const maxBytes = 1024 * 1024; // 1MB 제한
                if (file.size > maxBytes) {
                    alert("⚠️ 동영상 파일 크기가 1MB를 초과합니다!\n\n1MB 이하의 비디오만 무손실 압축 후 주소창 해시 쿼리에 안전 수납 공유가 가능합니다.");
                    return;
                }

                // 즉시 로딩 처리
                const blobUrl = URL.createObjectURL(file);
                bgVideoEl.src = blobUrl;
                bgVideoEl.load();
                bgVideoEl.muted = true;
                bgVideoEl.loop = true;
                bgVideoEl.play().catch(err => console.log('BGM 자동재생 대기'));

                bgVideoEl.style.opacity = (currentTheme === 'lovely') ? '0.3' : '0.45';
                bgImageEl.style.opacity = '0';

                try {
                    const arrayBuffer = await file.arrayBuffer();
                    const compressedBuffer = await compressGzip(arrayBuffer); 
                    const base64Data = await arrayBufferToBase64(compressedBuffer); 
                    
                    const gzipVideoUrl = `data:video/mp4;gzip;base64,${base64Data}`;
                    
                    // 주소창 해시 파라미터 v에 대입 (ReplaceState 연계로 서버 HTTP 414 원천 차단!)
                    updateUrlHash({ v: gzipVideoUrl, img: '' });
                    showToast("🎥 배경 동영상이 Gzip 무손실 압축되어 주소창에 저장되었습니다! 바로 공유해 보세요!");
                    
                } catch (compressErr) {
                    console.error("Gzip 압축 연동 도중 에러: ", compressErr);
                }
            }
        }

        // 이미지 초경량 압축 변환 및 해시 'img' 실시간 동기화
        function compressAndSyncImage(file) {
            const reader = new FileReader();
            reader.onload = function(event) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    
                    const maxDim = 180;
                    let w = img.width;
                    let h = img.height;
                    if (w > maxDim || h > maxDim) {
                        if (w > h) {
                            h = Math.round((h * maxDim) / w);
                            w = maxDim;
                        } else {
                            w = Math.round((w * maxDim) / h);
                            h = maxDim;
                        }
                    }
                    canvas.width = w;
                    canvas.height = h;
                    ctx.drawImage(img, 0, 0, w, h);
                    
                    const compressedBase64 = canvas.toDataURL('image/jpeg', 0.5);
                    
                    bgImageEl.style.backgroundImage = `url(${compressedBase64})`;
                    bgImageEl.style.opacity = (currentTheme === 'lovely') ? '0.3' : '0.45';
                    bgVideoEl.style.opacity = '0';
                    
                    // 해시 'img' 업데이트 및 'v' 제거
                    updateUrlHash({ img: compressedBase64, v: '' });
                    showToast("🖼️ 배경 이미지가 초경량 압축되어 주소창에 수납되었습니다! 자유롭게 공유해 보세요!");
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        }

        // 비동기 초기 비디오 디코딩 및 구동 함수
        async function loadInitialGzipVideo(base64Stream) {
            try {
                const base64String = base64Stream.split(',')[1];
                const compressedUint8 = base64ToUint8(base64String); 
                
                const decompressed = await decompressGzip(compressedUint8); 
                const restoredBlob = new Blob([decompressed], { type: 'video/mp4' }); 
                const restoredBlobUrl = URL.createObjectURL(restoredBlob);
                
                bgVideoEl.src = restoredBlobUrl;
                bgVideoEl.load();
                bgVideoEl.muted = true;
                bgVideoEl.loop = true;
                bgVideoEl.play().catch(err => console.log('BGM 재생제한'));
                
                bgVideoEl.style.opacity = (currentTheme === 'lovely') ? '0.3' : '0.45';
                bgImageEl.style.opacity = '0';
            } catch (decompressErr) {
                console.error("Gzip 비동기 복원 도중 에러: ", decompressErr);
            }
        }

        // 초기 기동 시 URL 해시 및 ? 쿼리(?v=, ?img=, #v=, #img=) 해독 및 배경 즉시 기동 구현
        const videoParam = getParam('v') || getParam('video');
        const imageParam = getParam('img') || getParam('image');

        if (imageParam && imageParam.trim() !== '') {
            bgImageEl.style.backgroundImage = `url(${imageParam})`;
            bgImageEl.style.opacity = (initialTheme === 'lovely') ? '0.3' : '0.45';
            bgVideoEl.style.opacity = '0';
        } else if (videoParam && videoParam.trim() !== '') {
            if (videoParam.includes('gzip;base64,')) {
                // Gzip 압축 스트림 배경 연동 비동기 압축 해제 구동
                loadInitialGzipVideo(videoParam);
            } else {
                // 일반 웹 동영상 주소 재생
                bgVideoEl.src = videoParam;
                bgVideoEl.style.opacity = (initialTheme === 'lovely') ? '0.3' : '0.45';
                bgImageEl.style.opacity = '0';
            }
        } else {
            // 둘 다 없으면 기본 그라데이션만 노출
            bgVideoEl.removeAttribute('src');
            bgVideoEl.style.opacity = '0';
            bgImageEl.style.opacity = '0';
        }

        // ==========================================
        // 5. HTML5 Canvas 하트 흩날리기 & 클릭 이펙트 (연타 콤보 3D 거대 하트 강림 지원)
        // ==========================================
        const canvas = document.getElementById('heartCanvas');
        const ctx = canvas.getContext('2d');

        let hearts = [];
        let bursts = [];
        let giantHearts = []; // 콤보 시 강림하는 거대 하트 저장용 배열
        
        // [모바일 기동 판단 하트 개수 최적화]
        const isMobileDevice = window.innerWidth <= 480;
        const maxHearts = isMobileDevice ? 40 : 75; // 모바일 가든은 아기자기하고 리소스 가속을 위해 40개 파티클로 최적화!

        function resizeCanvas() {
            const dpr = window.devicePixelRatio || 1;
            canvas.width = window.innerWidth * dpr;
            canvas.height = window.innerHeight * dpr;
            canvas.style.width = `${window.innerWidth}px`;
            canvas.style.height = `${window.innerHeight}px`;
            ctx.scale(dpr, dpr);
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // 3D 하트 드로잉
        function drawHeart(x, y, size, color, opacity, rotate = 0, glow = false, is3D = false) {
            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(rotate);
            ctx.globalAlpha = opacity;

            if (glow) {
                ctx.shadowBlur = size * 0.8;
                ctx.shadowColor = color;
            }

            if (is3D) {
                // [황금비 정석 하트 쉐이프 - 날개 모양 박멸]
                ctx.beginPath();
                ctx.moveTo(0, -size * 0.3); // 골짜기 시작
                ctx.bezierCurveTo(-size * 0.5, -size * 0.8, -size * 0.9, -size * 0.4, -size * 0.9, 0); // 왼쪽 봉우리
                ctx.bezierCurveTo(-size * 0.9, size * 0.35, -size * 0.4, size * 0.65, 0, size * 0.9); // 왼쪽 아래 수렴
                ctx.bezierCurveTo(size * 0.4, size * 0.65, size * 0.9, size * 0.35, size * 0.9, 0); // 오른쪽 아래 상승
                ctx.bezierCurveTo(size * 0.9, -size * 0.4, size * 0.5, -size * 0.8, 0, -size * 0.3); // 오른쪽 봉우리 도킹
                ctx.closePath();

                // 3D 구체/젤리 구글 돔 연출을 위한 입체 방사형 그라데이션 제작
                const radGrad = ctx.createRadialGradient(
                    -size / 3, -size / 3, size / 12,  // 이너 돔 광원
                    0, 0, size * 0.95                 // 아우터 돔 그림자 경계
                );

                // [옅은 분홍(Soft Baby Pink) 테마별 3D 그라데이션 완결]
                if (currentTheme === 'lovely') {
                    radGrad.addColorStop(0, '#ffffff'); 
                    radGrad.addColorStop(0.22, '#fff0f3'); 
                    radGrad.addColorStop(0.65, '#ffccd5'); 
                    radGrad.addColorStop(1, '#ff8fab'); 
                } else {
                    radGrad.addColorStop(0, '#ffffff'); 
                    radGrad.addColorStop(0.22, '#ffe5ec'); 
                    radGrad.addColorStop(0.65, '#ffb3c6'); 
                    radGrad.addColorStop(1, '#dfc5fe'); // 영롱하게 포개지는 연보라 마감
                }
                
                ctx.fillStyle = radGrad;
                ctx.fill();

                // 맑은 유리구슬 느낌을 매듭짓는 물방울형 광택 반사 타원(Glint) - 개편된 돔 형태에 맞춰 정렬 동조 완료
                ctx.beginPath();
                ctx.ellipse(-size * 0.38, -size * 0.45, size / 9, size / 20, Math.PI / 4, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(255, 255, 255, 0.48)'; 
                ctx.fill();
                
            } else {
                // 일반 낙하 및 비산 파티클은 전통적 하트 곡선을 이용한 경량 2D 단색 렌더링
                ctx.beginPath();
                const topY = -size / 2;
                ctx.moveTo(0, topY + size / 4);
                ctx.bezierCurveTo(-size / 2, topY - size / 4, -size, topY + size / 4, 0, topY + size);
                ctx.bezierCurveTo(size, topY + size / 4, size / 2, topY - size / 4, 0, topY + size / 4);
                ctx.closePath();

                ctx.fillStyle = color;
                ctx.fill();
            }
            
            ctx.restore();
        }

        // 1. 떨어지는 하트 (최대 크기 18px로 다시 콤팩트화)
        class FallingHeart {
            constructor(initTop = false) {
                this.x = Math.random() * window.innerWidth;
                this.y = initTop ? Math.random() * window.innerHeight : -20 - Math.random() * 50;
                this.size = Math.random() * 8 + 10; // 10px ~ 18px 아기자기!
                this.speed = Math.random() * 1.1 + 0.5;
                this.wind = Math.random() * 0.5 - 0.25;
                this.angle = Math.random() * Math.PI * 2;
                this.spinSpeed = Math.random() * 0.02 - 0.01;
                this.opacity = Math.random() * 0.45 + 0.25;
                this.color = this.getRandomThemeColor();
            }

            getRandomThemeColor() {
                const lovelyColors = ['#ff8fab', '#ffb3c6', '#ffc2d1', '#ff5c8a', '#ff758f'];
                const pastelColors = ['#8e9aff', '#b3c5ff', '#ff9ebb', '#e8dbfc', '#ffd6e8', '#cff4fc'];

                if (currentTheme === 'lovely') return lovelyColors[Math.floor(Math.random() * lovelyColors.length)];
                return pastelColors[Math.floor(Math.random() * pastelColors.length)];
            }

            update() {
                this.y += this.speed;
                this.x += Math.sin(this.angle) * 0.5 + this.wind;
                this.angle += this.spinSpeed;

                const dx = mouse.x - this.x;
                const dy = mouse.y - this.y;
                const dist = Math.hypot(dx, dy);
                if (dist < 120) {
                    const force = (120 - dist) / 120;
                    this.x -= (dx / dist) * force * 1.5;
                }

                if (this.y > window.innerHeight + 20 || this.x < -20 || this.x > window.innerWidth + 20) {
                    this.y = -20;
                    this.x = Math.random() * window.innerWidth;
                    this.color = this.getRandomThemeColor();
                }
            }

            draw() {
                drawHeart(this.x, this.y, this.size, this.color, this.opacity, this.angle * 0.1);
            }
        }

        // 2. 터지는 하트 (최대 크기 18px)
        class BurstHeart {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.size = Math.random() * 11 + 7; // 7px ~ 18px 아기자기!
                this.angle = Math.random() * Math.PI * 2;
                this.speed = Math.random() * 5.5 + 2.5;
                this.vx = Math.cos(this.angle) * this.speed;
                this.vy = Math.sin(this.angle) * this.speed - Math.random() * 1.5;
                this.gravity = 0.11;
                this.opacity = 1;
                this.decay = Math.random() * 0.018 + 0.01;
                this.color = this.getRandomThemeColor();
                this.rotate = Math.random() * Math.PI;
                this.spin = Math.random() * 0.2 - 0.1;
            }

            getRandomThemeColor() {
                const lovelyColors = ['#ff4d6d', '#ff0a54', '#ff758f', '#ff8fab', '#ffffff'];
                const pastelColors = ['#9b5de5', '#f15bb5', '#00bbf9', '#00f5d4', '#fee440', '#ffffff'];

                if (currentTheme === 'lovely') return lovelyColors[Math.floor(Math.random() * lovelyColors.length)];
                return pastelColors[Math.floor(Math.random() * pastelColors.length)];
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.vy += this.gravity;
                this.vx *= 0.98;
                this.rotate += this.spin;
                this.opacity -= this.decay;
            }

            draw() {
                if (this.opacity <= 0) return;
                drawHeart(this.x, this.y, this.size, this.color, this.opacity, this.rotate);
            }
        }

        // 3. 연타 이스터에그: 고동치며 둥둥 뜨는 "자체 발광 3D 입체 옅은 분홍 젤리 하트"
        // [점진 팽창 최대 4.0배 & 초고속 소멸 모션]
        class GiantHeart {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.baseSize = Math.random() * 25 + 115; 
                this.size = this.baseSize; 
                this.opacity = 1.0;
                this.rotate = Math.random() * 0.25 - 0.125; // 세련된 눕힘
                this.color = '#ffccd5'; // 옅은 핑크빛 부드러운 아우라 오버레이
                this.ySpeed = -0.7; // 빠르게 사라지는 템포에 맞춰 위로 날아가는 속도도 자연스럽게 상향
            }

            update() {
                // 위로 동동 부유
                this.y += this.ySpeed;
                
                // [소멸 속도 고속 튜닝] 감쇄율을 0.025로 대폭 상향하여 약 0.7초 만에 소멸 완료
                this.opacity -= 0.025; 
                
                // [4배 점진 대팽창 모션] 처음 크기(1.0배)에서 소멸시(4.0배)까지 진행률(Progress)에 맞춰 실시간 대팽창 보간
                const progress = 1.0 - this.opacity; 
                this.size = this.baseSize * (1.0 + progress * 3.0); // progress가 1이 될 때 정확히 4.0배 팽창 달성! (1 + 3 = 4)
            }

            draw() {
                if (this.opacity <= 0) return;
                // 세 번째 파라미터 is3D를 true로 지정해 3D 입체 옅은 분홍 정석 젤리로 렌더링!
                drawHeart(this.x, this.y, this.size, this.color, this.opacity, this.rotate, true, true);
            }
        }

        function initHearts() {
            hearts = [];
            for (let i = 0; i < maxHearts; i++) {
                hearts.push(new FallingHeart(true));
            }
        }
        initHearts();

        const mouse = { x: -1000, y: -1000 };
        window.addEventListener('mousemove', (e) => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
        });
        window.addEventListener('mouseleave', () => {
            mouse.x = -1000;
            mouse.y = -1000;
        });

        // 60fps 렌더링 루프
        function animate() {
            ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);

            // 1. 떨어지는 하트 그리기
            hearts.forEach(heart => {
                heart.update();
                heart.draw();
            });

            // 2. 팡팡 터지는 클릭 하트 그리기
            for (let i = bursts.length - 1; i >= 0; i--) {
                const p = bursts[i];
                p.update();
                if (p.opacity <= 0) {
                    bursts.splice(i, 1);
                } else {
                    p.draw();
                }
            }

            // 3. 연타 이스터에그 3D 거대 하트 그리기
            for (let i = giantHearts.length - 1; i >= 0; i--) {
                const gh = giantHearts[i];
                gh.update();
                if (gh.opacity <= 0) {
                    giantHearts.splice(i, 1);
                } else {
                    gh.draw();
                }
            }

            requestAnimationFrame(animate);
        }
        animate();

        // 마우스 클릭 시 하트 폭죽 트리거 & 연타 감지
        window.addEventListener('mousedown', (e) => {
            if (e.target.closest('.theme-selector') || e.target.closest('#recipientName') || e.target.closest('.upload-trigger') || e.target.closest('.utility-btn')) return;
            
            handleComboDetection(e.clientX, e.clientY);
            triggerBurst(e.clientX, e.clientY);
        });

        // 모바일 터치 대응
        window.addEventListener('touchstart', (e) => {
            if (e.touches[0]) {
                const t = e.touches[0];
                if (t.target.closest('.theme-selector') || t.target.closest('#recipientName') || t.target.closest('.upload-trigger') || t.target.closest('.utility-btn')) return;
                
                handleComboDetection(t.clientX, t.clientY);
                triggerBurst(t.clientX, t.clientY);
            }
        }, { passive: true });

        // 콤보 검출 알고리즘 함수
        function handleComboDetection(x, y) {
            const now = Date.now();
            if (now - lastClickTime < COMBO_TIMEOUT) {
                clickComboCount++;
            } else {
                clickComboCount = 1; // 기한이 지났으면 1로 초기화
            }
            lastClickTime = now;

            // 연속 클릭 임계치 도달 시 거대 3D 하트 소환!
            if (clickComboCount >= COMBO_THRESHOLD) {
                giantHearts.push(new GiantHeart(x, y));
                clickComboCount = 0; // 거대 하트 소환 직후 카운트 리셋하여 연속 소환 가능화
            }
        }

        function triggerBurst(x, y, count = 16) {
            for (let i = 0; i < count; i++) {
                bursts.push(new BurstHeart(x, y));
            }
        }

        // ==========================================
        // 5. 초기 테마 기동 실행
        // ==========================================
        switchTheme(initialTheme, true);
    </script>
</body>
</html>
